name: Verify Exact-Main Deployment Proof
on:
  workflow_call:
    inputs:
      controller_ref:
        type: string
        required: true
      completed_run_id:
        type: string
        required: true
    outputs:
      verified_sha:
        value: ${{ jobs.verify.outputs.verified_sha }}
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verified_sha: ${{ steps.proof.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Sushant-Nemade/autonomous-quality-redteam-harness
          ref: ${{ inputs.controller_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
      - run: uv sync --frozen
      - id: proof
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RUN_ID: ${{ inputs.completed_run_id }}
        run: uv run --frozen portfolio-maintenance verify-deployment --repository "$GITHUB_REPOSITORY" --run-id "$COMPLETED_RUN_ID"