name: Monitor Daily Portfolio Maintenance
on:
  schedule:
    - cron: '0 15 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.4'
      - run: uv sync --frozen
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen portfolio-maintenance monitor